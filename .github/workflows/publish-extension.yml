name: Publish Extension

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for creating releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Extract version from tag
        run: |
          TAG=${GITHUB_REF##*/}
          VERSION=${TAG#v}
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix webview-ui

      - name: Set package.json version
        run: npm version $VERSION --no-git-tag-version

      - name: Build and Package
        run: |
          npm run build:all
          npx vsce package

      # - name: Publish to Visual Studio Marketplace
      #   env:
      #     VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
      #   # continue-on-error: true # Optional: Uncomment if you want the GitHub Release to happen even if Marketplace fails
      #   run: npx vsce publish --pat $VSCE_TOKEN --packagePath *.vsix

      - name: Create GitHub Release and Upload VSIX
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VSIX_FILE=$(ls *.vsix | head -n 1)
          
          # We use --clobber so if you delete a release and re-run the action, it can overwrite
          gh release create ${{ env.TAG }} \
            --title "${{ env.TAG }}" \
            --notes "Release for version ${{ env.VERSION }}" \
            --clobber \
            "$VSIX_FILE"